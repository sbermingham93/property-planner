services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: property_progress
      POSTGRES_PASSWORD: property_progress
      POSTGRES_DB: property_progress
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U property_progress"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
